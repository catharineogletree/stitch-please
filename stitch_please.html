<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stitch, Please - Modern Embroidery Pattern Maker</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Fraunces:opsz,wght@9..144,400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FDFCF8',
                        clay: '#D96C4A',
                        moss: '#5F6E4E',
                        ochre: '#DAA520',
                        ink: '#2C2C2C',
                    },
                    fontFamily: {
                        sans: ['"Space Grotesk"', 'sans-serif'],
                        serif: ['"Fraunces"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FDFCF8;
            color: #2C2C2C;
        }
        .hoop-container {
            aspect-ratio: 1 / 1;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.05), 0 20px 50px rgba(0,0,0,0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .toast-enter { transform: translateY(100px); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease; }
    </style>
</head>
<body className="font-sans antialiased bg-cream text-ink">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const DMC_COLORS = [
            { id: "BLANC", name: "White", r: 255, g: 255, b: 255, hex: "#FFFFFF" },
            { id: "310", name: "Black", r: 0, g: 0, b: 0, hex: "#000000" },
            { id: "666", name: "Bright Red", r: 227, g: 11, b: 0, hex: "#E30B00" },
            { id: "995", name: "Electric Blue", r: 0, g: 107, b: 171, hex: "#006BAB" },
            { id: "702", name: "Kelly Green", r: 71, g: 151, b: 72, hex: "#479748" },
            { id: "444", name: "Lemon", r: 255, g: 216, b: 0, hex: "#FFD800" },
            { id: "602", name: "Medium Cranberry", r: 225, g: 54, b: 119, hex: "#E13677" },
            { id: "970", name: "Pumpkin", r: 247, g: 148, b: 29, hex: "#F7941D" },
            { id: "550", name: "Ultra Very Dark Grape", r: 92, g: 30, b: 100, hex: "#5C1E64" },
            { id: "3810", name: "Dark Turquoise", r: 0, g: 139, b: 154, hex: "#008B9A" },
            { id: "725", name: "Topaz", r: 255, g: 200, b: 0, hex: "#FFC800" },
            { id: "3348", name: "Light Yellow Green", r: 188, g: 213, b: 119, hex: "#BCD577" },
            { id: "817", name: "Very Dark Coral Red", r: 187, g: 5, b: 30, hex: "#BB051E" },
            { id: "905", name: "Dark Parrot Green", r: 52, g: 114, b: 17, hex: "#347211" },
            { id: "155", name: "Blue Violet", r: 150, g: 137, b: 191, hex: "#9689BF" }
        ];

        const FABRICS = {
            muslin: { name: "Muslin", color: "#F9F5EB", texture: "plain", advice: "Classic lightweight cotton. Use a sharp needle." },
            tshirt: { name: "T-Shirt", color: "#F3F4F6", texture: "knit", advice: "Use a water-soluble stabilizer to prevent puckering on jersey knit." },
            sweatshirt: { name: "Sweatshirt", color: "#E5E7EB", texture: "fleece", advice: "Thick fabric! Use a heavier gauge needle and firm hoop tension." },
            tote: { name: "Tote Bag", color: "#E8E3D9", texture: "canvas", advice: "Heavy duck canvas. Great for bold Satin stitches." }
        };

        const PRESETS = {
            peach: {
                name: "Warm Peach",
                url: "https://placehold.co/400x400/D96C4A/FFFFFF?text=🍑"
            },
            leaf: {
                name: "Sage Leaf",
                url: "https://placehold.co/400x400/5F6E4E/FFFFFF?text=🌿"
            },
            flower: {
                name: "Wild Rose",
                url: "https://placehold.co/400x400/E13677/FFFFFF?text=🌸"
            }
        };

        const App = () => {
            const [image, setImage] = useState(null);
            const [hoopSize, setHoopSize] = useState(6);
            const [strands, setStrands] = useState(3);
            const [colorLimit, setColorLimit] = useState(8);
            const [fabric, setFabric] = useState("muslin");
            const [originalOpacity, setOriginalOpacity] = useState(0); 
            const [processedData, setProcessedData] = useState(null);
            const [isProcessing, setIsProcessing] = useState(false);
            const [highlightedColor, setHighlightedColor] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);
            const canvasRef = useRef(null);

            const STITCHES_PER_INCH = 14;

            useEffect(() => {
                if (toastMessage) {
                    const timer = setTimeout(() => setToastMessage(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [toastMessage]);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            setImage(img);
                            processImage(img);
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const loadPreset = (presetUrl) => {
                setIsProcessing(true);
                const img = new Image();
                img.crossOrigin = "anonymous";
                img.onload = () => {
                    setImage(img);
                    processImage(img);
                };
                img.src = presetUrl;
            };

            const getColorDistance = (r1, g1, b1, r2, g2, b2) => {
                return Math.sqrt((r1-r2)**2 + (g1-g2)**2 + (b1-b2)**2);
            };

            const processImage = (img) => {
                setIsProcessing(true);
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const gridSize = hoopSize * STITCHES_PER_INCH;
                canvas.width = gridSize;
                canvas.height = gridSize;

                const minSide = Math.min(img.width, img.height);
                const sx = (img.width - minSide) / 2;
                const sy = (img.height - minSide) / 2;
                
                ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, gridSize, gridSize);
                const imgData = ctx.getImageData(0, 0, gridSize, gridSize).data;

                const pixels = [];
                const colorMap = new Map();

                for (let y = 0; y < gridSize; y++) {
                    for (let x = 0; x < gridSize; x++) {
                        const i = (y * gridSize + x) * 4;
                        const r = imgData[i];
                        const g = imgData[i + 1];
                        const b = imgData[i + 2];
                        const a = imgData[i + 3];

                        if (a < 128) {
                            pixels.push(null);
                            continue;
                        }

                        let bestMatch = DMC_COLORS[0];
                        let minDist = Infinity;

                        DMC_COLORS.forEach(color => {
                            const dist = getColorDistance(r, g, b, color.r, color.g, color.b);
                            if (dist < minDist) {
                                minDist = dist;
                                bestMatch = color;
                            }
                        });

                        let stitchType = "Long & Short"; 
                        
                        let isEdge = false;
                        if (x > 0 && x < gridSize - 1 && y > 0 && y < gridSize - 1) {
                            const nextIdx = (y * gridSize + (x + 1)) * 4;
                            const diff = Math.abs(imgData[i] - imgData[nextIdx]);
                            if (diff > 45) isEdge = true;
                        }

                        if (isEdge) {
                            stitchType = "Satin";
                        } else if (Math.random() > 0.97) {
                            stitchType = "French Knot";
                        }

                        const pixel = { color: bestMatch, type: stitchType, x, y };
                        pixels.push(pixel);

                        const count = colorMap.get(bestMatch.id) || 0;
                        colorMap.set(bestMatch.id, count + 1);
                    }
                }

                const palette = Array.from(colorMap.entries())
                    .map(([id, count]) => ({
                        ...DMC_COLORS.find(c => c.id === id),
                        count
                    }))
                    .sort((a, b) => b.count - a.count)
                    .slice(0, colorLimit);

                setProcessedData({ pixels, palette, gridSize });
                setIsProcessing(false);
                setToastMessage("Embroidery pattern updated!");
            };

            const drawCanvas = () => {
                if (!processedData || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const { pixels, gridSize } = processedData;
                
                const size = canvas.width;
                const cellSize = size / gridSize;

                // 1. Draw Fabric Base Color
                ctx.fillStyle = FABRICS[fabric].color;
                ctx.fillRect(0, 0, size, size);

                // 2. Draw Fabric Weave Texturing
                ctx.strokeStyle = 'rgba(0,0,0,0.04)';
                ctx.lineWidth = 0.5;
                if (FABRICS[fabric].texture === "plain" || FABRICS[fabric].texture === "canvas") {
                    for(let i=0; i<size; i+=3) {
                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
                    }
                } else if (FABRICS[fabric].texture === "knit") {
                    for(let i=0; i<size; i+=5) {
                        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
                    }
                }

                // 3. Draw Original Reference Image Overlay
                if (image && originalOpacity > 0) {
                    ctx.save();
                    ctx.globalAlpha = originalOpacity / 100;
                    ctx.drawImage(image, 0, 0, size, size);
                    ctx.restore();
                }

                // 4. Render Hand-Embroidery Stitches
                const strandThicknessMultiplier = 0.35 + (strands * 0.15); 

                pixels.forEach((p, i) => {
                    if (!p) return;
                    
                    const isHighlighted = !highlightedColor || highlightedColor === p.color.id;
                    ctx.globalAlpha = isHighlighted ? 1.0 : 0.12;
                    ctx.strokeStyle = p.color.hex;
                    ctx.fillStyle = p.color.hex;

                    const cx = p.x * cellSize;
                    const cy = p.y * cellSize;

                    if (p.type === "French Knot") {
                        ctx.beginPath();
                        const knotRadius = (cellSize / 3) * (0.6 + (strands * 0.15));
                        ctx.arc(cx + cellSize/2, cy + cellSize/2, Math.min(cellSize/2, knotRadius), 0, Math.PI*2);
                        ctx.fill();
                    } else if (p.type === "Satin") {
                        ctx.lineWidth = cellSize * 0.7 * strandThicknessMultiplier;
                        ctx.lineCap = "round";
                        ctx.beginPath();
                        ctx.moveTo(cx + 1, cy + cellSize/2);
                        ctx.lineTo(cx + cellSize - 1, cy + cellSize/2);
                        ctx.stroke();
                    } else {
                        ctx.lineWidth = cellSize * 0.5 * strandThicknessMultiplier;
                        ctx.lineCap = "round";
                        ctx.beginPath();
                        ctx.moveTo(cx + cellSize/2, cy);
                        ctx.lineTo(cx + cellSize/2, cy + cellSize * 1.4);
                        ctx.stroke();
                    }
                });
                ctx.globalAlpha = 1.0;
            };

            useEffect(() => {
                drawCanvas();
            }, [processedData, fabric, highlightedColor, strands, originalOpacity]);

            const copyToClipboard = (text) => {
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = text;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                setToastMessage("Copied to clipboard!");
            };

            return (
                <div className="min-h-screen flex flex-col bg-cream text-ink font-sans">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className={`fixed bottom-8 left-1/2 -translate-x-1/2 z-50 bg-neutral-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 ${toastMessage ? 'toast-active' : 'toast-enter'}`}>
                            <span className="text-ochre">✨</span>
                            <span className="text-sm font-medium">{toastMessage}</span>
                        </div>
                    )}

                    {/* Header */}
                    <header className="bg-white border-b border-neutral-100 px-8 py-6 flex justify-between items-center">
                        <div className="flex items-center gap-4">
                            <div className="w-10 h-10 bg-clay rounded-full flex items-center justify-center text-white text-xl">🧵</div>
                            <h1 className="font-serif text-3xl font-bold tracking-tight text-clay">Stitch, Please</h1>
                        </div>
                        <nav className="flex gap-8 text-sm font-medium uppercase tracking-widest text-neutral-500">
                            <span className="text-clay border-b-2 border-clay pb-1 cursor-default">Design Workspace</span>
                        </nav>
                    </header>

                    <main className="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-0 overflow-hidden">
                        
                        {/* LEFT: Controls Panel */}
                        <div className="lg:col-span-4 border-r border-neutral-100 bg-white p-8 overflow-y-auto custom-scrollbar">
                            <section className="space-y-10">
                                
                                {/* 01. Source Image */}
                                <div>
                                    <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-4 flex items-center gap-2">
                                        <span className="w-1.5 h-1.5 bg-clay rounded-full"></span> 01. Source Image
                                    </h3>
                                    <div className="border-2 border-dashed border-neutral-200 rounded-3xl p-6 text-center hover:border-clay transition-all cursor-pointer bg-neutral-50 group">
                                        <input type="file" onChange={handleFileUpload} className="hidden" id="file-upload" accept="image/*" />
                                        <label htmlFor="file-upload" className="cursor-pointer flex flex-col items-center gap-3">
                                            <div className="w-12 h-12 rounded-2xl bg-white shadow-sm flex items-center justify-center group-hover:scale-105 transition-transform">
                                                <svg className="w-6 h-6 text-clay" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                                </svg>
                                            </div>
                                            <div>
                                                <p className="font-bold text-neutral-700 text-sm">Upload custom photo</p>
                                                <p className="text-xs text-neutral-400">Drag or click to choose file</p>
                                            </div>
                                        </label>
                                    </div>

                                    {/* Design Presets (Quick Access Settings) */}
                                    <div className="mt-4">
                                        <p className="text-xs font-semibold text-neutral-400 mb-2">Or try a quick-start design:</p>
                                        <div className="grid grid-cols-3 gap-2">
                                            {Object.entries(PRESETS).map(([key, p]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => loadPreset(p.url)}
                                                    className="p-2 rounded-xl bg-neutral-50 hover:bg-neutral-100 border border-neutral-200 text-left transition-colors flex flex-col items-center justify-center gap-1"
                                                >
                                                    <span className="text-lg">{key === 'peach' ? '🍑' : key === 'leaf' ? '🌿' : '🌸'}</span>
                                                    <span className="text-[10px] font-bold text-neutral-600">{p.name}</span>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                {/* 02. Fabric Base */}
                                <div>
                                    <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-4 flex items-center gap-2">
                                        <span className="w-1.5 h-1.5 bg-clay rounded-full"></span> 02. Fabric Base
                                    </h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {Object.entries(FABRICS).map(([key, f]) => (
                                            <button 
                                                key={key}
                                                onClick={() => setFabric(key)}
                                                className={`p-4 rounded-2xl text-left border-2 transition-all ${fabric === key ? 'border-clay bg-orange-50 ring-2 ring-clay/10' : 'border-neutral-100 bg-white hover:border-neutral-300'}`}
                                            >
                                                <div className="flex items-center gap-3 mb-1">
                                                    <div className="w-4 h-4 rounded-full" style={{backgroundColor: f.color, border: '1px solid #ddd'}}></div>
                                                    <span className={`font-bold text-sm ${fabric === key ? 'text-clay' : 'text-neutral-700'}`}>{f.name}</span>
                                                </div>
                                                <p className="text-[10px] text-neutral-400 leading-tight">{f.advice}</p>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 03. Thread & Scale Settings */}
                                <div>
                                    <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-4 flex items-center gap-2">
                                        <span className="w-1.5 h-1.5 bg-clay rounded-full"></span> 03. Stitch & Scale Settings
                                    </h3>
                                    <div className="space-y-6 bg-neutral-50 p-6 rounded-3xl">
                                        {/* Strands setting */}
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-end">
                                                <label className="text-sm font-bold text-neutral-700">Thread Thickness</label>
                                                <span className="text-clay font-bold text-sm">{strands} {strands === 1 ? 'Strand' : 'Strands'}</span>
                                            </div>
                                            <input 
                                                type="range" min="1" max="6" step="1" 
                                                value={strands} onChange={(e) => setStrands(Number(e.target.value))}
                                                className="w-full accent-clay text-clay"
                                            />
                                            <p className="text-[10px] text-neutral-400">Controls line width & French knot volumes in your preview.</p>
                                        </div>

                                        {/* Design Width (Hoop size) */}
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-end">
                                                <label className="text-sm font-bold text-neutral-700">Design Hoop Width</label>
                                                <span className="text-clay font-bold text-sm">{hoopSize}" Diameter</span>
                                            </div>
                                            <input 
                                                type="range" min="3" max="12" step="1" 
                                                value={hoopSize} onChange={(e) => {setHoopSize(Number(e.target.value)); if(image) processImage(image);}}
                                                className="w-full accent-clay"
                                            />
                                            <div className="flex justify-between text-[10px] text-neutral-400 font-semibold">
                                                <span>3" (Mini)</span>
                                                <span>12" (Large)</span>
                                            </div>
                                        </div>

                                        {/* Palette limit */}
                                        <div className="space-y-2">
                                            <div className="flex justify-between items-end">
                                                <label className="text-sm font-bold text-neutral-700">Colors Cap</label>
                                                <span className="text-clay font-bold text-sm">{colorLimit} max</span>
                                            </div>
                                            <input 
                                                type="range" min="2" max="15" step="1" 
                                                value={colorLimit} onChange={(e) => {setColorLimit(Number(e.target.value)); if(image) processImage(image);}}
                                                className="w-full accent-clay"
                                            />
                                        </div>

                                        {/* Dynamic stats preview */}
                                        <div className="pt-4 border-t border-neutral-200 mt-2">
                                            <div className="flex justify-between text-xs font-medium text-neutral-500">
                                                <span>Total grid resolution:</span>
                                                <span>{hoopSize * STITCHES_PER_INCH} × {hoopSize * STITCHES_PER_INCH} nodes</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        </div>

                        {/* CENTER: Simulated Embroidery Hoop View */}
                        <div className="lg:col-span-5 bg-cream p-8 flex flex-col items-center justify-center relative overflow-hidden">
                            <div className="absolute inset-0 opacity-40 pointer-events-none" style={{backgroundImage: 'radial-gradient(#d1d1d1 0.5px, transparent 0.5px)', backgroundSize: '24px 24px'}}></div>
                            
                            <div className="relative z-10 w-full max-w-lg hoop-container rounded-full p-1 bg-[#8B5E3C] shadow-2xl flex items-center justify-center mb-6">
                                {/* Outer Wooden Hoop Ring */}
                                <div className="absolute inset-0 rounded-full border-[14px] border-[#A67C52] shadow-inner pointer-events-none"></div>
                                
                                <div className="w-[94%] h-[94%] bg-white rounded-full overflow-hidden relative shadow-inner">
                                    {!image ? (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center p-12 text-center bg-cream">
                                            <div className="w-20 h-20 mb-4 text-neutral-200">
                                                <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2">
                                                    <circle cx="50" cy="50" r="40" strokeDasharray="4 4" />
                                                    <path d="M40 50 L60 50 M50 40 L50 60" />
                                                </svg>
                                            </div>
                                            <p className="font-serif text-xl text-neutral-400 italic">Please upload a photo or pick a sample preset to load the embroidery canvas</p>
                                        </div>
                                    ) : (
                                        <canvas 
                                            ref={canvasRef} 
                                            width={800} 
                                            height={800} 
                                            className="w-full h-full object-cover"
                                        />
                                    )}
                                    {isProcessing && (
                                        <div className="absolute inset-0 bg-white/85 backdrop-blur-sm flex items-center justify-center flex-col gap-3">
                                            <div className="w-10 h-10 border-4 border-clay border-t-transparent rounded-full animate-spin"></div>
                                            <p className="text-xs font-bold text-clay uppercase tracking-widest">Optimizing Palette...</p>
                                        </div>
                                    )}
                                </div>
                                
                                {/* Metal Tension Adjustment Screw */}
                                <div className="absolute -top-6 left-1/2 -translate-x-1/2 w-10 h-14 bg-[#C0C0C0] rounded-sm shadow-md border-b-4 border-neutral-400 pointer-events-none">
                                    <div className="w-full h-2 bg-neutral-300 mt-2 border-y border-neutral-400"></div>
                                </div>
                            </div>

                            {/* Reference Image Tracing Slider */}
                            {image && (
                                <div className="w-full max-w-sm bg-white p-4 rounded-2xl border border-neutral-100 shadow-sm mb-6 z-10">
                                    <div className="flex justify-between items-center mb-1">
                                        <span className="text-xs font-bold text-neutral-500">Image Tracing Reference</span>
                                        <span className="text-xs font-bold text-clay">{originalOpacity}% opacity</span>
                                    </div>
                                    <input 
                                        type="range" min="0" max="100" step="5"
                                        value={originalOpacity} onChange={(e) => setOriginalOpacity(Number(e.target.value))}
                                        className="w-full accent-clay"
                                    />
                                    <p className="text-[10px] text-neutral-400 mt-1">Blends your raw original image under the stitch pattern simulation.</p>
                                </div>
                            )}

                            {image && (
                                <div className="flex gap-4 z-10">
                                    <button 
                                        onClick={() => window.print()}
                                        className="bg-white px-5 py-2.5 rounded-full shadow-lg text-xs font-bold text-neutral-700 flex items-center gap-2 hover:bg-neutral-50 transition-colors"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                                        Print Chart
                                    </button>
                                    <button 
                                        className="bg-clay text-white px-6 py-2.5 rounded-full shadow-lg text-xs font-bold flex items-center gap-2 hover:opacity-90 transition-opacity"
                                        onClick={() => {
                                            const link = document.createElement('a');
                                            link.download = 'stitch-please-design.png';
                                            link.href = canvasRef.current.toDataURL();
                                            link.click();
                                            setToastMessage("Pattern downloaded!");
                                        }}
                                    >
                                        Export Design
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* RIGHT: Thread Shopping List & Dynamic Insights */}
                        <div className="lg:col-span-3 bg-white border-l border-neutral-100 p-8 overflow-y-auto custom-scrollbar">
                            {!processedData ? (
                                <div className="h-full flex items-center justify-center text-center opacity-40">
                                    <p className="text-sm font-medium">Your thread map, floss totals, and dynamic stats will compile here once your graphic loads.</p>
                                </div>
                            ) : (
                                <div className="space-y-10">
                                    <div>
                                        <h3 className="text-xs font-bold uppercase tracking-widest text-neutral-400 mb-4">🧵 Thread Shopping List</h3>
                                        <p className="text-[10px] text-neutral-400 mb-4">Hover over any color swatch to isolate and highlight those stitches on the canvas preview.</p>
                                        
                                        <div className="space-y-3">
                                            {processedData.palette.map((color) => (
                                                <div 
                                                    key={color.id}
                                                    onMouseEnter={() => setHighlightedColor(color.id)}
                                                    onMouseLeave={() => setHighlightedColor(null)}
                                                    className={`group p-4 rounded-2xl border-2 transition-all cursor-pointer ${highlightedColor === color.id ? 'border-clay shadow-sm bg-orange-50' : 'border-neutral-50 hover:border-neutral-200'}`}
                                                >
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-10 h-10 rounded-xl shadow-inner relative" style={{backgroundColor: color.hex}}>
                                                            <div className="absolute inset-0 border border-black/10 rounded-xl"></div>
                                                        </div>
                                                        <div className="flex-1">
                                                            <p className="text-xs font-bold text-neutral-400 mb-0.5">DMC {color.id}</p>
                                                            <p className="text-sm font-bold text-neutral-800">{color.name}</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <p className="text-[10px] font-bold text-clay uppercase">Skeins ({strands} Str.)</p>
                                                            <p className="text-sm font-bold text-neutral-800">
                                                                {Math.max(1, Math.ceil((color.count * (strands / 3)) / 1500))}
                                                            </p>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        
                                        <button 
                                            onClick={() => copyToClipboard(processedData.palette.map(c => `DMC ${c.id} (${c.name})`).join('\n'))}
                                            className="w-full mt-6 py-4 rounded-2xl border-2 border-neutral-100 text-xs font-bold text-neutral-500 uppercase tracking-widest hover:border-clay hover:text-clay transition-all"
                                        >
                                            Copy DMC Thread List
                                        </button>
                                    </div>

                                    {/* Calculated Stitch Insights */}
                                    <div className="p-6 bg-neutral-900 rounded-3xl text-white">
                                        <h4 className="font-serif text-xl mb-4 text-ochre">Stitch Suggestions</h4>
                                        <div className="space-y-4 text-sm opacity-80">
                                            <div className="flex justify-between border-b border-white/10 pb-2">
                                                <span>Long & Short (Fills)</span>
                                                <span className="font-bold">~{Math.round(processedData.pixels.filter(p => p?.type === "Long & Short").length)}</span>
                                            </div>
                                            <div className="flex justify-between border-b border-white/10 pb-2">
                                                <span>Satin (Borders)</span>
                                                <span className="font-bold">~{Math.round(processedData.pixels.filter(p => p?.type === "Satin").length)}</span>
                                            </div>
                                            <div className="flex justify-between border-b border-white/10 pb-2">
                                                <span>French Knots</span>
                                                <span className="font-bold">~{processedData.pixels.filter(p => p?.type === "French Knot").length}</span>
                                            </div>
                                        </div>
                                        <p className="text-[10px] mt-4 opacity-50 italic">Recommended stitch paths correspond directly to the contrast density of your image.</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-neutral-100 px-8 py-4 flex justify-between items-center text-[10px] font-bold uppercase tracking-widest text-neutral-400">
                        <p>© 2026 Stitch, Please • Modern Pattern Engine</p>
                        <div className="flex gap-6">
                            <span>Privacy</span>
                            <span>Terms</span>
                            <span>Guides</span>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
